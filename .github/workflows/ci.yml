name: CI

on:
  pull_request:
  push:
    # claude/phase-*: phase branches created by Claude Code cloud sessions, which can't push to phase-<n>.
    branches: [main, 'phase-*', 'claude/phase-*']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the PR scan reads every commit since the base branch
      - run: scripts/check-secrets.sh
      # The repo is public: a key added in one commit and deleted in the next is still readable in the history.
      - if: github.event_name == 'pull_request'
        run: scripts/check-secrets.sh --range "origin/${{ github.base_ref }}"

  android:
    name: Android build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # CI only builds, so a placeholder Firebase config is enough; the real one never leaves the owner's machine.
      - run: cp androidApp/google-services.ci.json androidApp/google-services.json
      # verifySqlDelightMigration: the database schema from 1.db plus every .sqm must equal the .sq files.
      - run: ./gradlew :androidApp:assembleDebug lint :core:data:verifySqlDelightMigration --console=plain

  ios:
    name: iOS framework compile
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --console=plain
