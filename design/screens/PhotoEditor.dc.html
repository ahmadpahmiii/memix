<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Memix — Photo editor</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Space+Grotesk:wght@400;500;700&amp;family=Space+Mono&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
:root{--canvas:#111111;--stage:#000000;--surface:#1B1B1B;--surface-raised:#2C2C2C;--hairline:#393939;--text:#F2F2F2;--text-secondary:#A6A6A6;--text-muted:#949494;--primary:#2BB3F3;--primary-pressed:#189BD8;--primary-subtle:#2BB3F329;--on-primary:#111111;--selection:#FFFFFF;--track-video:#3D3D3D;--track-text:#E78E40;--track-sticker:#D8AE31;--track-meme-sound:#2BB3F3;--track-audio:#3DAE79;--track-effect:#AA84EB;--on-track:#111111;--danger:#F6574C;--success:#3BCE7B;--scrim:#000000B3}
a{color:#2BB3F3}a:hover{color:#189BD8}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: var(--canvas); color: var(--text); font-family: 'Space Grotesk', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
<header style="height: 56px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 4px">
<a href="Main.dc.html" aria-label="Close editor" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: var(--text)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
<div style="flex-grow: 1; display: flex; justify-content: center; gap: 4px">
<button aria-label="Undo" style="width: 44px; height: 44px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center; color: var(--text); cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"></path><path d="M4 9h11a5 5 0 0 1 0 10h-3"></path></svg></button>
<button aria-label="Redo" disabled style="width: 44px; height: 44px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center; color: var(--text-muted); cursor: default"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"></path><path d="M20 9H9a5 5 0 0 0 0 10h3"></path></svg></button>
</div>
<a href="ExportDone.dc.html" style="height: 40px; padding: 0 16px; box-sizing: border-box; border-radius: 10px; background: var(--primary); color: var(--on-primary); display: flex; align-items: center; font: 700 15px/22px 'Space Grotesk', sans-serif; text-decoration: none">Save</a>
</header>
<section aria-label="Canvas" style="flex-grow: 1; min-height: 0; background: var(--stage); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 12px 0">
<div style="width: 340px; height: 340px; background: var(--surface-raised); position: relative; overflow: visible; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 10px 12px; box-sizing: border-box">
<span aria-hidden="true" style="position: absolute; left: 50%; top: 58%; width: 150px; height: 190px; transform: translate(-50%, -50%); border-radius: 75px 75px 18px 18px; background: var(--track-video)"></span>
<p role="button" aria-label="Top caption, selected" style="position: relative; margin: 0; padding: 4px 8px; border: 2px solid var(--selection); font-family: 'Anton', Impact, sans-serif; font-size: 34px; line-height: 38px; text-align: center; text-transform: uppercase; color: #FFFFFF; -webkit-text-stroke: 2px #000000; paint-order: stroke fill">Me at 3 a.m.<span aria-hidden="true" style="position: absolute; left: -7px; top: -7px; width: 10px; height: 10px; background: var(--selection); border: 0"></span><span aria-hidden="true" style="position: absolute; right: -7px; top: -7px; width: 10px; height: 10px; background: var(--selection); border: 0"></span><span aria-hidden="true" style="position: absolute; left: -7px; bottom: -7px; width: 10px; height: 10px; background: var(--selection); border: 0"></span><span aria-hidden="true" style="position: absolute; right: -7px; bottom: -7px; width: 10px; height: 10px; background: var(--selection); border: 0"></span></p>
<p style="position: relative; margin: 0; font-family: 'Anton', Impact, sans-serif; font-size: 34px; line-height: 38px; text-align: center; text-transform: uppercase; color: #FFFFFF; -webkit-text-stroke: 2px #000000; paint-order: stroke fill">One more episode</p>
</div>
<a href="VideoEditor.dc.html" style="height: 36px; box-sizing: border-box; padding: 0 14px; border-radius: 9999px; background: var(--surface-raised); color: var(--text); display: flex; align-items: center; gap: 6px; font: 500 13px/16px 'Space Grotesk', sans-serif; text-decoration: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2BB3F3" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="2"></rect><path d="M16 10l5-3v10l-5-3z"></path></svg>Make it a video meme</a>
</section>
<div style="flex: none; display: flex; flex-direction: column; gap: 8px; padding: 12px 0 12px 16px; background: var(--canvas)">
<span id="format-label" style="font-size: 13px; line-height: 16px; font-weight: 500; color: var(--text-secondary)">Format</span>
<div role="radiogroup" aria-labelledby="format-label" style="display: flex; gap: 8px; overflow: hidden">
<button role="radio" aria-checked="true" style="height: 36px; flex: none; padding: 0 14px; border-radius: 9999px; background: var(--text); color: var(--on-primary); font: 500 13px/16px 'Space Grotesk', sans-serif; cursor: pointer">Classic</button>
<button role="radio" aria-checked="false" style="height: 36px; flex: none; padding: 0 14px; border-radius: 9999px; border: 0; background: var(--surface-raised); color: var(--text); font: 500 13px/16px 'Space Grotesk', sans-serif; cursor: pointer">Caption bar</button>
<button role="radio" aria-checked="false" style="height: 36px; flex: none; padding: 0 14px; border-radius: 9999px; border: 0; background: var(--surface-raised); color: var(--text); font: 500 13px/16px 'Space Grotesk', sans-serif; cursor: pointer">Panels</button>
<button role="radio" aria-checked="false" style="height: 36px; flex: none; padding: 0 14px; border-radius: 9999px; border: 0; background: var(--surface-raised); color: var(--text); font: 500 13px/16px 'Space Grotesk', sans-serif; cursor: pointer">Demotivational</button>
<button role="radio" aria-checked="false" style="height: 36px; flex: none; padding: 0 14px; border-radius: 9999px; border: 0; background: var(--surface-raised); color: var(--text); font: 500 13px/16px 'Space Grotesk', sans-serif; cursor: pointer">Bubbles</button>
</div>
</div>
<div aria-label="Selected text" style="height: 52px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: var(--surface-raised); border-top: 1px solid var(--hairline)">
<span style="flex: none; font-size: 13px; line-height: 16px; font-weight: 700; display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 9999px; background: var(--track-text); "></span>Text</span>
<button style="height: 36px; flex: none; padding: 0 10px; border-radius: 9999px; border: 0; background: var(--surface); color: var(--text); font: 400 15px/16px 'Anton', Impact, sans-serif; cursor: pointer">Impact style</button>
<button aria-label="Text color white" aria-pressed="true" style="width: 32px; height: 32px; flex: none; border-radius: 9999px; border: 0; outline: 2px solid var(--selection); outline-offset: 2px; background: #FFFFFF; padding: 0; cursor: pointer"></button>
<button aria-label="Text color yellow" aria-pressed="false" style="width: 32px; height: 32px; flex: none; border-radius: 9999px; border: 0; background: #FFD60A; padding: 0; cursor: pointer"></button>
<button aria-label="Text color black" aria-pressed="false" style="width: 32px; height: 32px; flex: none; border-radius: 9999px; border: 1px solid var(--hairline); background: #000000; padding: 0; cursor: pointer"></button>
<button style="height: 36px; flex: none; margin-left: auto; padding: 0 10px; border-radius: 9999px; border: 0; background: var(--surface); color: var(--text); font: 500 13px/16px 'Space Grotesk', sans-serif; cursor: pointer">Outline</button>
</div>
<nav aria-label="Photo tools" style="height: 72px; flex: none; box-sizing: border-box; display: flex; gap: 4px; padding: 8px; overflow: hidden; background: var(--surface); border-top: 1px solid var(--hairline)">
<button aria-pressed="true" style="background: var(--primary-subtle); width: 64px; min-height: 48px; flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 0; border-radius: 10px; color: var(--primary); font: 500 11px/14px 'Space Grotesk', sans-serif; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V5h16v2M9 19h6M12 5v14"></path></svg>Text</button>
<button style="width: 64px; min-height: 48px; flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 0; border-radius: 10px; background: none; color: var(--text-secondary); font: 500 11px/14px 'Space Grotesk', sans-serif; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3H6a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3h7l8-8V6a3 3 0 0 0-3-3z"></path><path d="M13 21v-5a3 3 0 0 1 3-3h5"></path></svg>Stickers</button>
<a href="RemoveBackground.dc.html" style="width: 64px; min-height: 48px; flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-radius: 10px; color: var(--text-secondary); font: 500 11px/14px 'Space Grotesk', sans-serif; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path><path d="M3 3l18 18"></path></svg>Remove BG</a>
<button style="width: 64px; min-height: 48px; flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 0; border-radius: 10px; background: none; color: var(--text-secondary); font: 500 11px/14px 'Space Grotesk', sans-serif; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l3.5-1 11-11a2.1 2.1 0 0 0-3-3l-11 11z"></path></svg>Draw</button>
<button style="width: 64px; min-height: 48px; flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 0; border-radius: 10px; background: none; color: var(--text-secondary); font: 500 11px/14px 'Space Grotesk', sans-serif; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg>Adjust</button>
<button style="width: 64px; min-height: 48px; flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 0; border-radius: 10px; background: none; color: var(--text-secondary); font: 500 11px/14px 'Space Grotesk', sans-serif; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M3 9h18M3 15h18M9 3v18M15 3v18"></path></svg>Censor</button>
<button style="width: 64px; min-height: 48px; flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 0; border-radius: 10px; background: none; color: var(--text-secondary); font: 500 11px/14px 'Space Grotesk', sans-serif; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v14a2 2 0 0 0 2 2h14"></path><path d="M18 22V8a2 2 0 0 0-2-2H2"></path></svg>Crop</button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
