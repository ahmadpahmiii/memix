<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Memix — Export</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Space+Grotesk:wght@400;500;700&amp;family=Space+Mono&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
:root{--canvas:#111111;--stage:#000000;--surface:#1B1B1B;--surface-raised:#2C2C2C;--hairline:#393939;--text:#F2F2F2;--text-secondary:#A6A6A6;--text-muted:#949494;--primary:#2BB3F3;--primary-pressed:#189BD8;--primary-subtle:#2BB3F329;--on-primary:#111111;--selection:#FFFFFF;--track-video:#3D3D3D;--track-text:#E78E40;--track-sticker:#D8AE31;--track-meme-sound:#2BB3F3;--track-audio:#3DAE79;--track-effect:#AA84EB;--on-track:#111111;--danger:#F6574C;--success:#3BCE7B;--scrim:#000000B3}
a{color:#2BB3F3}a:hover{color:#189BD8}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: var(--canvas); color: var(--text); font-family: 'Space Grotesk', system-ui, sans-serif; position: relative; overflow: hidden">
<div aria-hidden="true" style="display: flex; flex-direction: column; height: 100%">
<div style="height: 56px; flex: none"></div>
<div style="flex-grow: 1; background: var(--stage); display: flex; align-items: center; justify-content: center"><span style="width: 190px; height: 338px; background: var(--surface-raised)"></span></div>
<div style="height: 260px; flex: none; padding: 28px 0 0 72px; display: flex; flex-direction: column; gap: 8px"><span style="width: 300px; height: 40px; border-radius: 6px; background: var(--track-video)"></span><span style="width: 120px; height: 24px; margin-left: 20px; border-radius: 6px; background: var(--track-text)"></span><span style="width: 56px; height: 24px; margin-left: 124px; border-radius: 6px; background: var(--track-meme-sound)"></span><span style="width: 300px; height: 24px; border-radius: 6px; background: var(--track-audio)"></span></div>
</div>
<a href="VideoEditor.dc.html" aria-label="Close export" style="position: absolute; inset: 0; background: var(--scrim)"></a>
<section role="dialog" aria-labelledby="export-title" style="position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface); border-radius: 16px 16px 0 0; box-shadow: 0 -8px 24px #00000080; padding: 8px 16px 32px; display: flex; flex-direction: column; gap: 16px">
<span style="align-self: center; width: 40px; height: 4px; border-radius: 9999px; background: var(--hairline)"></span>
<div style="display: flex; align-items: center; justify-content: space-between">
<h2 id="export-title" style="margin: 0; font-family: 'Anton', Impact, sans-serif; font-weight: 400; font-size: 28px; line-height: 30px; text-transform: uppercase">Export</h2>
<a href="VideoEditor.dc.html" aria-label="Close" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: var(--text)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span id="res-label" style="font-size: 13px; line-height: 16px; font-weight: 500; color: var(--text-secondary)">Resolution</span>
<div role="radiogroup" aria-labelledby="res-label" style="display: grid; grid-template-columns: repeat(4, 1fr); padding: 4px; gap: 4px; border-radius: 10px; background: var(--canvas)">
<button role="radio" aria-checked="false" style="height: 40px; border-radius: 6px; border: 0; background: transparent; color: var(--text-secondary); font: 500 15px/22px 'Space Grotesk', sans-serif; cursor: pointer">720p</button>
<button role="radio" aria-checked="true" style="height: 40px; border-radius: 6px; border: 0; background: var(--surface-raised); color: var(--text); font: 500 15px/22px 'Space Grotesk', sans-serif; cursor: pointer">1080p</button>
<button role="radio" aria-checked="false" style="height: 40px; border-radius: 6px; border: 0; background: transparent; color: var(--text-secondary); font: 500 15px/22px 'Space Grotesk', sans-serif; cursor: pointer">2K</button>
<button role="radio" aria-checked="false" style="height: 40px; border-radius: 6px; border: 0; background: transparent; color: var(--text-secondary); font: 500 15px/22px 'Space Grotesk', sans-serif; cursor: pointer">4K</button>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span id="fps-label" style="font-size: 13px; line-height: 16px; font-weight: 500; color: var(--text-secondary)">Frame rate</span>
<div role="radiogroup" aria-labelledby="fps-label" style="display: grid; grid-template-columns: repeat(3, 1fr); padding: 4px; gap: 4px; border-radius: 10px; background: var(--canvas)">
<button role="radio" aria-checked="false" style="height: 40px; border-radius: 6px; border: 0; background: transparent; color: var(--text-secondary); font: 500 15px/22px 'Space Grotesk', sans-serif; cursor: pointer">24 fps</button>
<button role="radio" aria-checked="true" style="height: 40px; border-radius: 6px; border: 0; background: var(--surface-raised); color: var(--text); font: 500 15px/22px 'Space Grotesk', sans-serif; cursor: pointer">30 fps</button>
<button role="radio" aria-checked="false" style="height: 40px; border-radius: 6px; border: 0; background: transparent; color: var(--text-secondary); font: 500 15px/22px 'Space Grotesk', sans-serif; cursor: pointer">60 fps</button>
</div>
</div>
<div style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 10px; background: var(--surface-raised)">
<div style="flex-grow: 1; min-width: 0"><div style="font-size: 15px; line-height: 22px; font-weight: 500">Memix watermark</div><div style="font-size: 13px; line-height: 16px; color: var(--text-secondary)">Watch a short ad to remove it from this export</div></div>
<button style="height: 40px; flex: none; padding: 0 12px; border-radius: 10px; border: 0; background: transparent; color: var(--primary); display: flex; align-items: center; gap: 6px; font: 700 13px/16px 'Space Grotesk', sans-serif; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="#2BB3F3" stroke="#2BB3F3" stroke-width="1.75" stroke-linejoin="round"><path d="M8 5l11 7-11 7z"></path></svg>Remove</button>
</div>
<div style="display: flex; justify-content: space-between; font: 12px/16px 'Space Mono', monospace; color: var(--text-secondary)"><span>MP4 · H.264 · AAC</span><span>Est. 18 MB · about 20 s</span></div>
<a href="ExportDone.dc.html" style="height: 56px; box-sizing: border-box; border-radius: 10px; background: var(--primary); color: var(--on-primary); display: flex; align-items: center; justify-content: center; font: 700 18px/24px 'Space Grotesk', sans-serif; text-decoration: none">Export video</a>
</section>
</div>
</x-dc>

</body>
</html>
