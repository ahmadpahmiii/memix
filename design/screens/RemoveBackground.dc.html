<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Memix — Remove background</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Space+Grotesk:wght@400;500;700&amp;family=Space+Mono&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
:root{--canvas:#111111;--stage:#000000;--surface:#1B1B1B;--surface-raised:#2C2C2C;--hairline:#393939;--text:#F2F2F2;--text-secondary:#A6A6A6;--text-muted:#949494;--primary:#2BB3F3;--primary-pressed:#189BD8;--primary-subtle:#2BB3F329;--on-primary:#111111;--selection:#FFFFFF;--track-video:#3D3D3D;--track-text:#E78E40;--track-sticker:#D8AE31;--track-meme-sound:#2BB3F3;--track-audio:#3DAE79;--track-effect:#AA84EB;--on-track:#111111;--danger:#F6574C;--success:#3BCE7B;--scrim:#000000B3}
a{color:#2BB3F3}a:hover{color:#189BD8}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: var(--canvas); color: var(--text); font-family: 'Space Grotesk', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
<header style="height: 56px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 8px 0 4px">
<a href="PhotoEditor.dc.html" aria-label="Back to photo editor" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: var(--text)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></a>
<h1 style="margin: 0; flex-grow: 1; font-size: 18px; line-height: 24px; font-weight: 700">Remove background</h1>
</header>
<section aria-label="Cut-out preview" style="flex-grow: 1; min-height: 0; background: var(--stage); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 12px 0">
<div style="width: 340px; height: 340px; position: relative; overflow: hidden; background-color: #262626; background-image: repeating-conic-gradient(#3A3A3A 0 25%, #262626 0 50%); background-size: 20px 20px">
<span aria-hidden="true" style="position: absolute; left: 50%; top: 52%; width: 120px; height: 120px; transform: translate(-50%, -100%); border-radius: 9999px; background: #6B6B6B; border: 2px solid #FFFFFF"></span>
<span aria-hidden="true" style="position: absolute; left: 50%; bottom: 0; width: 220px; height: 150px; transform: translateX(-50%); border-radius: 110px 110px 0 0; background: #6B6B6B; border: 2px solid #FFFFFF; border-bottom: 0"></span>
<span aria-hidden="true" style="position: absolute; left: 238px; top: 120px; width: 48px; height: 48px; box-sizing: border-box; border-radius: 9999px; border: 2px solid var(--selection); background: #FFFFFF26"></span>
</div>
<div role="status" style="height: 36px; box-sizing: border-box; padding: 0 14px; border-radius: 9999px; background: var(--success); color: var(--on-track); display: flex; align-items: center; gap: 6px; font: 500 13px/16px 'Space Grotesk', sans-serif"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>Background removed · 1.2 s</div>
</section>
<div style="flex: none; display: flex; flex-direction: column; gap: 16px; padding: 16px 16px 32px; background: var(--surface); border-top: 1px solid var(--hairline)">
<div role="radiogroup" aria-label="Brush mode" style="display: grid; grid-template-columns: 1fr 1fr; padding: 4px; gap: 4px; border-radius: 10px; background: var(--canvas)">
<button role="radio" aria-checked="true" style="height: 40px; border-radius: 6px; border: 0; background: var(--surface-raised); color: var(--text); font: 500 15px/22px 'Space Grotesk', sans-serif; cursor: pointer">Erase</button>
<button role="radio" aria-checked="false" style="height: 40px; border-radius: 6px; border: 0; background: transparent; color: var(--text-secondary); font: 500 15px/22px 'Space Grotesk', sans-serif; cursor: pointer">Restore</button>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between"><label for="brush-size" style="font-size: 13px; line-height: 16px; font-weight: 500; color: var(--text-secondary)">Brush size</label><span style="font: 12px/16px 'Space Mono', monospace; color: var(--text)">24 px</span></div>
<div style="position: relative; height: 24px; display: flex; align-items: center"><span style="position: absolute; left: 0; right: 0; height: 4px; border-radius: 9999px; background: var(--hairline)"></span><span style="position: absolute; left: 0; width: 40%; height: 4px; border-radius: 9999px; background: var(--primary)"></span><span id="brush-size" role="slider" aria-valuemin="4" aria-valuemax="80" aria-valuenow="24" tabindex="0" style="position: absolute; left: calc(40% - 12px); width: 24px; height: 24px; box-sizing: border-box; border-radius: 9999px; background: var(--selection)"></span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between"><label for="edge-soft" style="font-size: 13px; line-height: 16px; font-weight: 500; color: var(--text-secondary)">Edge softness</label><span style="font: 12px/16px 'Space Mono', monospace; color: var(--text)">30%</span></div>
<div style="position: relative; height: 24px; display: flex; align-items: center"><span style="position: absolute; left: 0; right: 0; height: 4px; border-radius: 9999px; background: var(--hairline)"></span><span style="position: absolute; left: 0; width: 30%; height: 4px; border-radius: 9999px; background: var(--primary)"></span><span id="edge-soft" role="slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="30" tabindex="0" style="position: absolute; left: calc(30% - 12px); width: 24px; height: 24px; box-sizing: border-box; border-radius: 9999px; background: var(--selection)"></span></div>
</div>
<p style="margin: 0; font-size: 13px; line-height: 16px; color: var(--text-secondary)">Runs on your phone. Your photo is never uploaded.</p>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px">
<button style="height: 52px; border-radius: 10px; background: var(--surface-raised); color: var(--text); font: 700 15px/22px 'Space Grotesk', sans-serif; cursor: pointer">Save as sticker</button>
<a href="PhotoEditor.dc.html" style="height: 52px; box-sizing: border-box; border-radius: 10px; background: var(--primary); color: var(--on-primary); display: flex; align-items: center; justify-content: center; font: 700 15px/22px 'Space Grotesk', sans-serif; text-decoration: none">Apply</a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
