<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Memix</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--canvas); color: var(--text); font-family: var(--font-sans); overflow: hidden; }
  .cover { position: relative; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 288px; }
  .brand { fill: var(--primary); }
  .raised { fill: var(--surface-raised); }
  .sound { fill: var(--track-meme-sound); }
  .audio { fill: var(--track-audio); }
  .text { fill: var(--track-text); }
  .sticker { fill: var(--track-sticker); }
  .effect { fill: var(--track-effect); }
  .video { fill: var(--track-video); }
  .head, .play { fill: var(--selection); }
  .words { position: absolute; left: var(--space-6); bottom: var(--space-6); max-width: 440px; }
  .name { margin: 0; font-family: var(--font-display); font-size: 120px; line-height: .92; font-weight: 400; letter-spacing: .01em; color: var(--text); }
  .tag { margin: var(--space-2) 0 0 4px; font-size: 14px; line-height: 20px; color: var(--text-secondary); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      one primary 160x232 slab bled off the top (the brand: Memix blue) · two surface-raised blocks as neutral chrome · together with the clips about 30% of 960x288
  arrangement one tall blue slab beside neutral satellites above a strip of timeline lanes; flat fills, no outlines, as the chrome draws them
  pattern     a literal motif, the timeline: track-height (28) clips at a 36 row pitch in their track colors (video, text, sticker, meme sound, audio, effect), plus a playhead-width selection-white line with a radius-full head
  scales      sides and gaps in space-2 multiples; block corners radius-lg; clip corners radius-sm; lane pitch 36 = track-height + space-2
-->
<rect class="brand" x="16" y="-16" width="160" height="232" rx="16"/>
<rect class="raised" x="192" y="24" width="128" height="88" rx="16"/>
<rect class="raised" x="336" y="-16" width="160" height="128" rx="16"/>
<rect class="video" x="192" y="136" width="136" height="28" rx="6"/>
<rect class="video" x="332" y="136" width="148" height="28" rx="6"/>
<rect class="text" x="208" y="172" width="88" height="28" rx="6"/>
<rect class="sticker" x="312" y="172" width="56" height="28" rx="6"/>
<rect class="sound" x="256" y="208" width="48" height="28" rx="6"/>
<rect class="sound" x="400" y="208" width="40" height="28" rx="6"/>
<rect class="audio" x="192" y="244" width="288" height="28" rx="6"/>
<rect class="effect" x="264" y="280" width="72" height="28" rx="6"/>
<rect class="play" x="271" y="128" width="2" height="160"/>
<circle class="head" cx="272" cy="128" r="6"/>
</svg>
</div>
<div class="words">
<h1 class="name">Memix</h1>
<p class="tag">Neutral chrome, one blue.</p>
</div>
</div>
</body>
</html>
