<!-- @dsCard group="Overlays" height=440 subtitle="Export sheet" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Sheet — preview</title></head>
<body>
<div class="mx-phone" style="background:var(--scrim);padding-top:var(--space-6)">
  <div class="mx-sheet">
    <div class="mx-grabber"></div>
    <h2>Export video</h2>
    <div class="mx-field">Resolution<span class="val">1080p</span></div>
    <div class="mx-field">Frame rate<span class="val">30 fps</span></div>
    <div class="mx-field">Format<span class="val">MP4</span></div>
    <div class="mx-field"><span>Small "Memix" text<span class="hint">Watch a short ad to remove it from this export.</span></span><button class="mx-btn mx-btn-quiet" style="min-height:40px">Remove</button></div>
    <p class="mx-est">Est. 18 MB · about 20 s</p>
    <button class="mx-btn mx-btn-primary mx-btn-block">Export</button>
  </div>
</div>
</body>
</html>
