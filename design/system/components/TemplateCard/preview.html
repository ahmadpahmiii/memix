<!-- @dsCard group="Browse" height=320 subtitle="green screen · preset · photo" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>TemplateCard — preview</title></head>
<body>
<div class="mx-row" style="align-items:flex-start">
  <div class="mx-tcard">
    <div class="thumb"><span class="cap">ME WATCHING THE NEWS</span><span class="badge">Green screen</span></div>
    <div class="meta">TV reaction<small>1 video slot</small></div>
  </div>
  <div class="mx-tcard">
    <div class="thumb"><span class="cap">BOOM</span><span class="badge">Preset</span></div>
    <div class="meta">Boom zoom<small>1 slot · 1 caption</small></div>
  </div>
  <div class="mx-tcard">
    <div class="thumb" style="flex-direction:column;align-items:stretch;padding:var(--space-2);gap:var(--space-2)"><span style="flex:1;background:var(--surface);border-radius:var(--radius-sm)"></span><span style="flex:1;background:var(--surface);border-radius:var(--radius-sm)"></span><span class="badge">Photo</span></div>
    <div class="meta">Two-panel<small>2 photos · 2 captions</small></div>
  </div>
</div>
</body>
</html>
